<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>{% if page.title and page.title != "Dashboard" %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
<link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}"/>
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml"/>
<meta name="description" content="{{ page.description | default: site.description }}"/>
<meta name="theme-color" content="#f8fafc"/>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}"/>
<link rel="stylesheet" href="{{ '/assets/css/playbook.css' | relative_url }}"/>

<meta property="og:site_name" content="{{ site.title }}"/>
<meta property="og:title" content="{% if page.title and page.title != 'Dashboard' %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}"/>
<meta property="og:description" content="{{ page.description | default: site.description }}"/>
<meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}"/>
<meta property="og:type" content="website"/>
<meta property="og:image" content="{{ '/assets/img/og-card.svg' | absolute_url }}"/>
<meta name="twitter:card" content="summary_large_image"/>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-YKJ7X3GZYF"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-YKJ7X3GZYF');
</script>
